<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>onthespot</title>
<style>
:root{--fg:#16181d;--bg:#fff;--dim:#7a7f8a;--line:#e6e8ec;--soft:#f5f6f8;--ok:#0f8a3d;--okbg:#e9f7ee;--bad:#c8321f;--badbg:#fbeeec;--warn:#a86400;--warnbg:#fdf4e3;--blue:#1d5fd6;--bluebg:#eaf1fd;--purple:#6d3fc4;--purplebg:#f2ecfb}
body.dark{--fg:#e8eaee;--bg:#131417;--dim:#8b8f99;--line:#2a2d33;--soft:#1c1e23;--ok:#57cf82;--okbg:#15291c;--bad:#ff7b6b;--badbg:#311b17;--warn:#e0a63f;--warnbg:#2d2413;--blue:#6d9ff2;--bluebg:#17233a;--purple:#af8df0;--purplebg:#241b36}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 "SF Mono",ui-monospace,Menlo,monospace}
a{color:var(--blue)}.dim{color:var(--dim)}.warn{color:var(--warn)}
main{max-width:760px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin:0 0 28px}
.cards{display:grid;gap:12px}
.card{border:1px solid var(--line);padding:16px;cursor:pointer}
.card:hover{border-color:var(--blue)}
.card h3{margin:0 0 6px;font-size:14px}
.card p{margin:0 0 10px;color:var(--dim);font-size:12px;line-height:1.5}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.chip{border:1px solid var(--line);border-radius:9px;padding:1px 8px;color:var(--dim)}
#chat{display:none;max-width:760px;margin:0 auto;padding:0 20px 20px;height:100vh;flex-direction:column}
#chat.on{display:flex}
#picker.off{display:none}
header.bar{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
header.bar h2{font-size:14px;margin:0}
header.bar .line{font-size:11px;color:var(--dim)}
.timer{font-size:12px;color:var(--dim)}
.timer.over{color:var(--warn);font-weight:700}
#log{flex:1 1 auto;overflow-y:auto;padding:16px 0}
.turn{margin:0 0 16px;padding-left:12px;border-left:3px solid var(--line);max-width:85%}
.turn.assistant{border-left-color:var(--purple)}
.turn.user{margin-left:auto;padding-left:0;padding-right:12px;border-left:none;border-right:3px solid var(--blue);text-align:right}
.who{font-size:10px;letter-spacing:.06em;color:var(--dim)}
.turn.assistant .who{color:var(--purple)}.turn.user .who{color:var(--blue)}
.txt{white-space:pre-wrap;margin:2px 0 4px}
.chips{font-size:11px;color:var(--dim)}
.turn.err{border-left-color:var(--bad);color:var(--bad)}
footer.composer{flex:0 0 auto;border-top:1px solid var(--line);padding:12px 0}
textarea{width:100%;min-height:64px;resize:vertical;font:14px/1.5 "SF Mono",ui-monospace,Menlo,monospace;background:var(--soft);color:var(--fg);border:1px solid var(--line);padding:10px;outline:none}
textarea:focus{border-color:var(--blue)}
.footrow{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px}
.wc{color:var(--dim)}.wc.over{color:var(--warn);font-weight:700}
.btns{display:flex;gap:8px}
button{font:12px "SF Mono",ui-monospace,Menlo,monospace;border:1px solid var(--line);background:var(--soft);color:var(--fg);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--blue)}
button.primary{border-color:var(--blue);color:var(--blue)}
#endpanel{display:none;padding:20px;border:1px solid var(--line);margin-top:12px}
#endpanel.on{display:block}
kbd{border:1px solid var(--line);padding:0 4px;border-radius:2px}
</style>
<main id=picker>
<h1>onthespot</h1>
<p class=sub>difficult conversations and situations, think and navigate gracefully. pick a scenario. <kbd>m</kbd> light/dark.</p>
<div class=cards id=cards><p class=dim>loading scenarios...</p></div>
</main>

<div id=chat>
<header class=bar>
  <div>
    <h2 id=scTitle></h2>
    <div class=line id=scLine title=""></div>
  </div>
  <div>
    <span class=timer id=timer>0:00</span>
    <button id=endBtn>end session</button>
  </div>
</header>
<div id=log></div>
<footer class=composer>
  <textarea id=box autofocus autocomplete=off autocorrect=off autocapitalize=off spellcheck=false placeholder="dictate or type. enter to send, shift+enter for a new line."></textarea>
  <div class=footrow>
    <span class=wc id=wc>0 words</span>
    <span class=dim id=budget></span>
  </div>
</footer>
<div id=endpanel>
  <p id=endMsg></p>
  <div class=btns>
    <a id=reportLink href="#" target=_blank><button class=primary>open report</button></a>
    <button id=backBtn>back to scenarios</button>
  </div>
</div>
</div>

<script>
if (matchMedia("(prefers-color-scheme:dark)").matches) document.body.classList.add("dark");
addEventListener("keydown", (e) => { if (e.key === "m" && document.activeElement !== box) document.body.classList.toggle("dark"); });

const cardsEl = document.getElementById("cards");
const pickerEl = document.getElementById("picker");
const chatEl = document.getElementById("chat");
const logEl = document.getElementById("log");
const box = document.getElementById("box");
const wcEl = document.getElementById("wc");
const budgetEl = document.getElementById("budget");
const timerEl = document.getElementById("timer");
const endPanel = document.getElementById("endpanel");

let state = null; // { run, meta, targetS, budgetMax, lastCounterpartAt, startedAt }
let timerHandle = null;

async function loadScenarios() {
  const res = await fetch("/api/scenarios");
  const list = await res.json();
  cardsEl.innerHTML = "";
  for (const s of list) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<h3>${esc(s.title)}</h3><p>${esc(s.description || "")}</p>
      <div class=chiprow><span class=chip>${esc(s.audience || "")}</span><span class=chip>${esc(s.target_minutes || "?")} min</span><span class=chip>${esc(s.response_budget_seconds || "?")}s replies</span></div>`;
    div.onclick = () => startSession(s.id);
    cardsEl.appendChild(div);
  }
  if (!list.length) cardsEl.innerHTML = "<p class=dim>no scenarios found.</p>";
}

function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

async function startSession(id) {
  const res = await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ scenario: id }) });
  const data = await res.json();
  const meta = data.meta;
  const budget = (meta.response_budget_seconds || "").split("-").map((n) => parseInt(n, 10)).filter((n) => !isNaN(n));
  state = {
    run: data.run, meta,
    targetS: meta.target_minutes ? +meta.target_minutes * 60 : null,
    budgetMax: budget.length ? budget[budget.length - 1] : null,
    lastCounterpartAt: Date.now(), startedAt: Date.now(),
  };
  document.getElementById("scTitle").textContent = meta.title || id;
  document.getElementById("scLine").textContent = `${meta.audience || ""} · ${meta.power_dynamic || ""}`;
  document.getElementById("scLine").title = meta.power_dynamic || "";
  logEl.innerHTML = "";
  endPanel.classList.remove("on");
  if (data.opening) addTurn("assistant", data.opening, "");
  pickerEl.classList.add("off");
  chatEl.classList.add("on");
  box.value = ""; updateWc(); box.focus();
  startTimer();
}

function startTimer() {
  if (timerHandle) clearInterval(timerHandle);
  const tick = () => {
    const s = Math.floor((Date.now() - state.startedAt) / 1000);
    const mm = Math.floor(s / 60), ss = s % 60;
    timerEl.textContent = `${mm}:${String(ss).padStart(2, "0")}` + (state.targetS ? ` / ${Math.floor(state.targetS / 60)}:${String(state.targetS % 60).padStart(2, "0")}` : "");
    timerEl.classList.toggle("over", state.targetS !== null && s > state.targetS);
  };
  tick();
  timerHandle = setInterval(tick, 1000);
}

function addTurn(role, text, chips) {
  const d = document.createElement("div");
  d.className = "turn " + role;
  d.innerHTML = `<div class=who>${role === "user" ? "ben" : "counterpart"}</div><div class=txt></div><div class=chips></div>`;
  d.querySelector(".txt").textContent = text;
  d.querySelector(".chips").textContent = chips || "";
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}

function addError(msg) {
  const d = document.createElement("div");
  d.className = "turn err";
  d.innerHTML = `<div class=who>error</div><div class=txt></div>`;
  d.querySelector(".txt").textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateWc() {
  const w = box.value.trim() ? box.value.trim().split(/\s+/).length : 0;
  const s = Math.round((w / 140) * 60);
  const over = state && state.budgetMax !== null && s > state.budgetMax;
  wcEl.textContent = `${w} words ~ ${s}s spoken`;
  wcEl.classList.toggle("over", over);
  budgetEl.textContent = state && state.meta.response_budget_seconds ? `budget ${state.meta.response_budget_seconds}s` : "";
}
box.addEventListener("input", updateWc);
box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

async function send() {
  const text = box.value.trim();
  if (!text || !state) return;
  const thinkMs = Date.now() - state.lastCounterpartAt;
  addTurn("user", text, `thought ${Math.round(thinkMs / 1000)}s`);
  box.value = ""; updateWc();
  const bubble = addTurn("assistant", "", "streaming...");
  const txtEl = bubble.querySelector(".txt");
  const chipsEl = bubble.querySelector(".chips");
  const sendStart = Date.now();
  let firstTokenAt = null;
  try {
    const res = await fetch("/api/message", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ run: state.run, text }) });
    if (!res.ok || !res.body) throw new Error(`server error ${res.status}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        if (part.startsWith("event: done")) {
          const dataLine = part.split("\n").find((l) => l.startsWith("data:"));
          if (dataLine) {
            const stats = JSON.parse(dataLine.slice(5).trim());
            chipsEl.textContent = `first token ${stats.first_token_ms}ms · ${stats.total_ms}ms · $${(stats.usd || 0).toFixed(6)}`;
          }
          state.lastCounterpartAt = Date.now();
        } else if (part.startsWith("data:")) {
          if (firstTokenAt === null) { firstTokenAt = Date.now() - sendStart; chipsEl.textContent = `first token ${firstTokenAt}ms`; }
          const delta = JSON.parse(part.slice(5).trim());
          txtEl.textContent += delta;
          logEl.scrollTop = logEl.scrollHeight;
        }
      }
    }
  } catch (e) {
    chipsEl.textContent = "";
    addError("stream failed: " + e.message);
  }
  box.focus();
}

document.getElementById("endBtn").onclick = async () => {
  if (!state) return;
  const res = await fetch("/api/end", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ run: state.run }) });
  const data = await res.json();
  if (timerHandle) clearInterval(timerHandle);
  document.getElementById("endMsg").textContent = "session ended. report:";
  document.getElementById("reportLink").href = data.report || "#";
  endPanel.classList.add("on");
};

document.getElementById("backBtn").onclick = () => {
  chatEl.classList.remove("on");
  pickerEl.classList.remove("off");
  state = null;
  loadScenarios();
};

loadScenarios();
</script>
